<ng-container *transloco="let t; prefix: 'statsUser.bookFlow'">
  <app-stats-chart-card
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()"
    [emptyMessage]="t('noData') + ' ' + t('noDataHint')">
    @if (state() === 'ready') {
      <div class="relative w-full" [style.height.px]="plotHeight()">
        <canvas #flowCanvas class="block" [attr.aria-label]="t('title')" role="img"></canvas>
      </div>
    }

    @if (state() === 'ready') {
      <app-stats-chart-summary statsChartSummary [items]="summaryItems()" />
    }
  </app-stats-chart-card>
</ng-container>
