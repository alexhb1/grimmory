<ng-container *transloco="let t; prefix: 'statsUser.peakHours'">
  <app-stats-chart-card
    [sectionedHeader]="true"
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()">
    <div statsChartActions class="flex items-center gap-2">
      <app-select
        size="sm"
        styleClass="min-w-28"
        [showClear]="true"
        [options]="yearSelectOptions()"
        [value]="year()"
        [placeholder]="t('allYears')"
        [ariaLabel]="t('selectYear')"
        (valueChange)="onYearChange($event)" />
      <app-select
        size="sm"
        styleClass="min-w-32"
        [disabled]="year() === null"
        [showClear]="true"
        [options]="monthSelectOptions()"
        [value]="month()"
        [placeholder]="t('allMonths')"
        [ariaLabel]="t('selectMonth')"
        (valueChange)="onMonthChange($event)" />
    </div>

    @if (state() === 'ready') {
      <div class="relative min-w-0" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [type]="chartType"
          [data]="chartData()"
          [options]="chartOptions()"></canvas>
      </div>
    }
  </app-stats-chart-card>
</ng-container>
