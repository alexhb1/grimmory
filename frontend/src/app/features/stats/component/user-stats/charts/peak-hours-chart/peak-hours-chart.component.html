<ng-container *transloco="let t; prefix: 'statsUser.peakHours'">
  <app-stats-chart-card
    [sectionedHeader]="true"
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()">
    <div statsChartActions class="flex items-center gap-2">
      <app-select
        size="sm"
        styleClass="min-w-28"
        [showClear]="true"
        [options]="yearSelectOptions()"
        [value]="year()"
        [placeholder]="t('allYears')"
        [ariaLabel]="t('selectYear')"
        (valueChange)="onYearChange($event)" />
      <app-select
        size="sm"
        styleClass="min-w-32"
        [showClear]="true"
        [options]="monthSelectOptions()"
        [value]="month()"
        [placeholder]="t('allMonths')"
        [ariaLabel]="t('selectMonth')"
        (valueChange)="onMonthChange($event)" />
    </div>

    @if (state() === 'ready') {
      <div class="relative min-w-0" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [type]="chartType"
          [data]="chartData()"
          [options]="chartOptions()"></canvas>
      </div>

      <ul class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1.5 px-2 text-xs text-text-secondary">
        @for (entry of legend(); track entry.id) {
          <li class="flex items-center gap-1.5">
            <svg class="size-2.5 shrink-0" viewBox="0 0 10 10" aria-hidden="true">
              <circle cx="5" cy="5" r="5" [attr.fill]="entry.color"></circle>
            </svg>
            <span>{{ entry.label }}</span>
          </li>
        }
      </ul>
    }
  </app-stats-chart-card>
</ng-container>
