<ng-container *transloco="let t; prefix: 'statsUser.publicationEra'">
  <app-stats-chart-card
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()"
    [emptyMessage]="t('noData') + ' ' + t('noDataHint')">
    @if (state() === 'ready') {
      <div class="relative" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [data]="chartData()"
          [options]="chartOptions()"
          [type]="chartType"></canvas>
      </div>
    }

    @if (state() === 'ready' && !loading()) {
      <dl
        statsChartSummary
        class="grid grid-cols-2 gap-x-5 gap-y-4 border-t border-border pt-4 sm:grid-cols-4">
        @if (stats().bestDecade; as bestDecade) {
          <div class="min-w-0">
            <dt class="text-xs font-medium text-text-secondary">{{ t('bestDecade') }}</dt>
            <dd class="mt-1 text-lg font-semibold tabular-nums text-text-strong">
              {{ bestDecade.label }}
            </dd>
          </div>

          <div class="min-w-0">
            <dt class="text-xs font-medium text-text-secondary">{{ t('avgRating') }}</dt>
            <dd class="mt-1 text-lg font-semibold tabular-nums text-text-strong">
              {{ formatRating(bestDecade.averageRating) }}/10
            </dd>
          </div>
        }

        <div class="min-w-0">
          <dt class="text-xs font-medium text-text-secondary">{{ t('booksRated') }}</dt>
          <dd class="mt-1 text-lg font-semibold tabular-nums text-text-strong">
            {{ stats().ratedBookCount }}
          </dd>
        </div>
      </dl>
    }
  </app-stats-chart-card>
</ng-container>
