<ng-container *transloco="let t; prefix: 'statsUser.completionTimeline'">
  <app-stats-chart-card
    [sectionedHeader]="true"
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()">
    <div statsChartActions class="flex items-center gap-3">
      <app-select
        size="sm"
        styleClass="min-w-24"
        [options]="yearSelectOptions()"
        [value]="year()"
        [ariaLabel]="yearSelectorLabel()"
        (valueChange)="onYearChange($event)" />
    </div>
    @if (state() === 'ready') {
      <app-stats-categorical-bar [plot]="plot()" [height]="plotHeight()" />

      <app-stats-chart-legend [items]="legend()" styleClass="mt-2" />
    }
  </app-stats-chart-card>
</ng-container>
