<ng-container *transloco="let t; prefix: 'statsUser.completionTimeline'">
  <app-stats-chart-card
    [sectionedHeader]="true"
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()">
    <div statsChartActions class="flex items-center gap-3">
      <app-button
        tone="neutral"
        variant="ghost"
        size="sm"
        iconOnly
        [ariaLabel]="previousYearLabel()"
        [title]="previousYearLabel()"
        (clicked)="changeYear(-1)">
        <svg lucideChevronLeft aria-hidden="true"></svg>
      </app-button>
      <span class="min-w-12 text-center text-sm font-medium tabular-nums text-text-strong">
        {{ year() }}
      </span>
      <app-button
        tone="neutral"
        variant="ghost"
        size="sm"
        iconOnly
        [ariaLabel]="nextYearLabel()"
        [title]="nextYearLabel()"
        (clicked)="changeYear(1)">
        <svg lucideChevronRight aria-hidden="true"></svg>
      </app-button>
    </div>

    @if (state() === 'ready') {
      <div class="relative min-w-0" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [type]="chartType"
          [data]="chartData()"
          [options]="chartOptions()"></canvas>
      </div>
    }
  </app-stats-chart-card>
</ng-container>
