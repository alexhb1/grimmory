<ng-container *transloco="let t; prefix: 'statsUser.sessionArchetypes'">
  <app-stats-chart-card
    [sectionedHeader]="true"
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()"
    [emptyMessage]="t('noData') + ' ' + t('noDataHint')">
    <div statsChartActions class="flex items-center gap-3">
      <app-select
        size="sm"
        styleClass="min-w-24"
        [options]="yearSelectOptions()"
        [value]="year()"
        [ariaLabel]="yearSelectorLabel()"
        (valueChange)="onYearChange($event)" />
    </div>

    @if (state() === 'ready') {
      <div class="relative min-w-0" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [type]="chartType"
          [data]="chartData()"
          [options]="chartOptions()"></canvas>
      </div>

      <ul class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1.5 px-2 text-xs text-text-secondary">
        @for (entry of legend(); track entry.dayOfWeek) {
          <li class="flex items-center gap-1.5">
            <svg class="size-2.5 shrink-0" viewBox="0 0 10 10" aria-hidden="true">
              <circle cx="5" cy="5" r="5" [attr.fill]="entry.color"></circle>
            </svg>
            <span>{{ entry.label }}</span>
          </li>
        }
      </ul>
    }

    @if (state() === 'ready' && !loading()) {
      <dl
        statsChartSummary
        class="grid grid-cols-2 gap-x-5 gap-y-4 border-t border-border pt-4">
        <div class="min-w-0">
          <dt class="text-xs font-medium text-text-secondary">{{ t('sessions') }}</dt>
          <dd class="mt-1 text-lg font-semibold tabular-nums text-text-strong">
            {{ stats().sessionCount }}
          </dd>
        </div>

        <div class="min-w-0">
          <dt class="text-xs font-medium text-text-secondary">{{ t('dominantType') }}</dt>
          <dd
            class="mt-1 truncate text-lg font-semibold tabular-nums text-text-strong"
            [title]="dominantArchetypeLabel()">
            {{ dominantArchetypeLabel() }}
          </dd>
        </div>
      </dl>
    }
  </app-stats-chart-card>
</ng-container>
