<ng-container *transloco="let t; prefix: 'statsUser.readingDebt'">
  <app-stats-chart-card
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()"
    [emptyMessage]="t('noData') + ' ' + t('noDataHint')">
    @if (state() === 'ready') {
      <div class="relative" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [data]="chartData()"
          [options]="chartOptions()"
          [type]="chartType"></canvas>
      </div>
    }

    @if (state() === 'ready' && !loading()) {
      <dl
        statsChartSummary
        class="grid grid-cols-2 gap-x-5 gap-y-4 border-t border-border pt-4">
        <div class="min-w-0">
          <dt class="text-xs font-medium text-text-secondary">{{ t('currentBacklog') }}</dt>
          <dd class="mt-1 text-lg font-semibold tabular-nums text-text-strong">
            {{ stats().currentBacklog }}
          </dd>
        </div>

        <div class="min-w-0">
          <dt class="text-xs font-medium text-text-secondary">{{ t('trendLabel') }}</dt>
          <dd class="mt-1 text-lg font-semibold tabular-nums text-text-strong">
            {{ trendLabel() }}
          </dd>
        </div>
      </dl>
    }
  </app-stats-chart-card>
</ng-container>
