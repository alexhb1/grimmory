<ng-container *transloco="let t; prefix: 'statsLibrary.publicationTimeline'">
  <app-stats-chart-card
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()"
    [emptyMessage]="t('noData')">
    @if (state() === 'ready') {
      <div class="mb-1 flex min-h-4 items-center justify-end px-2 text-xs tabular-nums text-text-muted">
        @if (!loading()) {
          {{ t('booksWithDates', { count: formatCount(stats().totalBooks) }) }}
        }
      </div>

      <app-stats-categorical-bar [plot]="plot()" [height]="plotHeight()" />
    }

    @if (summaryItems().length > 0) {
      <app-stats-chart-summary statsChartSummary [items]="summaryItems()" />
    }
  </app-stats-chart-card>
</ng-container>
