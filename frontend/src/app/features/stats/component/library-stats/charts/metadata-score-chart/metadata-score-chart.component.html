<ng-container *transloco="let t; prefix: 'statsLibrary.metadataScore'">
  <app-stats-chart-card
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [state]="state()"
    [emptyMessage]="t('noData')">
    @if (loading()) {
      <div
        class="relative overflow-hidden rounded-lg bg-text/4"
        [style.height.px]="plotHeight()"
        role="status"
        [attr.aria-label]="loadingMessage()">
        <div
          class="absolute inset-0 animate-pulse bg-linear-to-r from-transparent via-text/8 to-transparent motion-reduce:animate-none"
          aria-hidden="true"></div>
      </div>
    } @else if (state() === 'ready') {
      <app-stats-circular-chart-layout [plotHeight]="plotHeight()">
        <canvas
          statsCircularChartPlot
          baseChart
          [data]="chartData()"
          [options]="chartOptions"
          [type]="chartType"></canvas>

        <div statsCircularChartLegend class="min-w-0">
          <dl class="mb-2 min-w-0">
            <dt class="text-xs font-medium text-text-secondary">{{ t('averageLabel') }}</dt>
            <dd class="mt-1 text-lg font-semibold tabular-nums text-text-strong">
              {{ averageValue() }}
            </dd>
          </dl>
          <ul
            class="min-w-0 space-y-1.5 overflow-y-auto pr-1 text-xs text-text-secondary"
            [style.maxHeight.px]="plotHeight()">
            @for (row of scoreStats(); track row.id) {
              <li class="flex min-w-0 items-center gap-2">
                <svg class="size-2.5 shrink-0" viewBox="0 0 10 10" aria-hidden="true">
                  <circle cx="5" cy="5" r="5" [attr.fill]="row.color"></circle>
                </svg>
                <span class="min-w-0 flex-1 truncate" [title]="row.range">{{ row.range }}</span>
                <span class="shrink-0 pl-5 font-medium tabular-nums text-text-strong">
                  {{ formatCount(row.count) }}
                </span>
              </li>
            }
          </ul>
        </div>
      </app-stats-circular-chart-layout>
    }
  </app-stats-chart-card>
</ng-container>
