<ng-container *transloco="let t; prefix: 'statsLibrary.topItems'">
  <app-stats-chart-card
    [sectionedHeader]="true"
    [heading]="t('titlePrefix') + ' ' + selectedDataType().label"
    [description]="t('descriptionPrefix') + ' ' + selectedDataType().label.toLowerCase() + ' ' + t('descriptionSuffix')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()"
    [emptyMessage]="t('noDataPrefix') + ' ' + selectedDataType().label.toLowerCase() + ' ' + t('noDataSuffix') + ' ' + t('noDataHintPrefix') + ' ' + selectedDataType().label.toLowerCase() + ' ' + t('noDataHintSuffix')">
    <div statsChartActions class="flex items-center gap-3">
      @if (totalItems() > 0) {
        <span class="hidden text-xs text-text-muted sm:inline">
          {{ totalItems() }} {{ t('shown') }}
        </span>
      }
      <app-select
        size="sm"
        styleClass="min-w-36"
        [options]="dataTypeOptions"
        [value]="selectedDataType().value"
        [ariaLabel]="t('titlePrefix')"
        (valueChange)="onDataTypeChange($event)" />
    </div>

    @if (state() === 'ready') {
      <div class="relative min-w-0" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [data]="chartData()"
          [options]="chartOptions()"
          [type]="chartType"></canvas>
      </div>
    }

    @if (state() === 'ready' && !loading() && insights().length > 0) {
      <dl
        statsChartSummary
        class="grid grid-cols-2 gap-x-5 gap-y-4 border-t border-border pt-4 sm:grid-cols-4">
        @for (insight of insights(); track insight.label) {
          <div class="min-w-0">
            <dt class="text-xs font-medium text-text-secondary">{{ insight.label }}</dt>
            <dd class="mt-1 truncate text-lg font-semibold tabular-nums text-text-strong" [title]="insight.value">
              {{ insight.value }}
            </dd>
          </div>
        }
      </dl>
    }
  </app-stats-chart-card>
</ng-container>
