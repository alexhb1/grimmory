<ng-container *transloco="let t; prefix: 'statsLibrary.authorUniverse'">
  <app-stats-chart-card
    [heading]="t('title')"
    [description]="t('description')"
    [showDescription]="showDescription()"
    [loadingMessage]="loadingMessage()"
    [plotHeight]="plotHeight()"
    [state]="state()"
    [emptyMessage]="t('noData')">
    @if (totalAuthors() > 0) {
      <span statsChartActions class="text-xs text-text-muted">
        {{ t('authorsBadge', { count: totalAuthors() }) }}
      </span>
    }
    @if (state() === 'ready') {
      <app-stats-chart-legend [items]="legend()" styleClass="mb-1" />

      <div class="relative min-w-0" [style.height.px]="plotHeight()">
        <canvas
          baseChart
          [data]="chartData()"
          [options]="chartOptions"
          [type]="chartType"></canvas>
      </div>

      <p class="mt-2 px-2 text-xs text-text-muted">{{ t('legendNote') }}</p>
    }

    @if (insightTiles().length > 0 && !loading()) {
      <app-stats-chart-summary
        statsChartSummary
        [items]="insightTiles()"
        [containerColumns]="true" />
    }
  </app-stats-chart-card>
</ng-container>
